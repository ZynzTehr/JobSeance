<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- JobSeance mark: the header's lantern orb on the site's ink background. Source for scripts/make-icons.mjs. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a9bcff" stop-opacity="0.55" />
      <stop offset="0.6" stop-color="#a9bcff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#a9bcff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb" cx="35%" cy="35%" r="72%">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#a9bcff" />
      <stop offset="1" stop-color="#4b5fa8" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#121a2f" />
  <circle cx="32" cy="32" r="27" fill="url(#halo)" />
  <circle cx="32" cy="32" r="16" fill="url(#orb)" />
</svg>
